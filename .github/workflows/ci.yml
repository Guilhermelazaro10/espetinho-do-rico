name: CI

on:
  push:
    branches: [main]
  pull_request:

# Só o token de leitura; nada aqui escreve no repositório.
permissions:
  contents: read

# Push novo na mesma branch cancela a execução anterior — sem fila de runs
# obsoletos gastando minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc é a fonte única da versão (VPS, CI e máquina local batem).
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        working-directory: backend

      - name: Backend — lint
        run: npm run lint --workspace backend

      - name: Backend — testes
        run: npm test --workspace backend

      - name: Frontend — lint
        run: npm run lint --workspace frontend

      - name: Frontend — testes
        run: npm test --workspace frontend

      - name: Frontend — build
        run: npm run build --workspace frontend

      - name: Migrations aplicam do zero
        # Um schema alterado à mão passa nos testes (que usam mock) e só
        # quebra no deploy. Aqui o banco é criado do zero pelas migrations.
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: file:./ci-check.db

  seguranca:
    name: Vulnerabilidades nas dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Bloqueia o merge: é o código que roda na VPS atendendo a internet.
      - name: Vulnerabilidades no que vai para produção
        run: npm audit --omit=dev --audit-level=high

      # Só informa: Electron, Vite e afins não sobem para o servidor. Uma CVE
      # em ferramenta de build não pode impedir o deploy de uma correção.
      - name: Vulnerabilidades nas ferramentas de build (informativo)
        run: npm audit --audit-level=high
        continue-on-error: true
